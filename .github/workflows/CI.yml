name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref so pushing twice doesn't spin up
# duplicate pipelines.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  Lint:
    # Ruff (lint + format), pydoclint and bandit — all Python-only, fast,
    # share the same interpreter setup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install lint tools
        run: |
          python -m pip install \
            "ruff==0.15.20" \
            "pydoclint==0.9.1" \
            "bandit==1.9.4"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check --diff .
      - name: Pydoclint check
        run: pydoclint .
      - name: Bandit (medium+)
        run: bandit -c _bandit.yaml -ll -r .

  Redshift-Recipe-Test:
    # Check selection of the Redshift exporter without a Maya installation.
    # Native shader conversion and baking checks run locally in Maya/Blender.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Check Redshift export recipe selection
        run: python -m unittest tests.test_redshift_recipe

  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: './bk_client/client/go.mod'
          cache-dependency-path: './bk_client/client/go.sum'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build add-on
        run: python bk_maya/dev.py build
      - name: Store the build
        uses: actions/upload-artifact@v4
        with:
          name: bk_maya-${{ github.event.pull_request.number || github.sha }}
          path: |
            out/stage
